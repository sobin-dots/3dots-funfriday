<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" rx="16" fill="#12181a"/>
  <circle cx="150" cy="150" r="125" fill="#1c2428" stroke="#e0e0e0" stroke-width="4"/>
  <!-- 1904 Shell - realistic vertical clam/mussel shell drawing -->
  <g transform="translate(150, 140) scale(1.1)">
    <path d="M 0 -80 C 40 -70 70 -30 65 30 C 60 70 30 80 0 85 C -30 80 -60 70 -65 30 C -70 -30 -40 -70 0 -80 Z" fill="#2a343a" stroke="#ffffff" stroke-width="4"/>
    <!-- Shell Ridges -->
    <path d="M 0 -80 L 0 85" stroke="#ffffff" stroke-width="3"/>
    <path d="M 0 -80 Q 25 0 25 80" stroke="#ffffff" stroke-width="2"/>
    <path d="M 0 -80 Q -25 0 -25 80" stroke="#ffffff" stroke-width="2"/>
    <path d="M 0 -80 Q 45 10 48 65" stroke="#ffffff" stroke-width="2"/>
