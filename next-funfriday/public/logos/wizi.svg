<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gradWizi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glowWizi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Wizi Circuit 'W' Badge -->
  <g transform="translate(15, 15)">
    <rect x="0" y="0" width="85" height="85" rx="20" fill="#0f172a" stroke="url(#gradWizi)" stroke-width="3" />
    <!-- Stylized W Tech lines -->
    <path d="M 20 28 L 32 62 L 42.5 42 L 53 62 L 65 28" fill="none" stroke="url(#gradWizi)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowWizi)" />
    <circle cx="20" cy="28" r="4" fill="#06b6d4" />
    <circle cx="65" cy="28" r="4" fill="#10b981" />
  </g>

  <!-- Typography -->
  <text x="120" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="48" fill="#ffffff" letter-spacing="-0.5">Wizi</text>
  <text x="122" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#38bdf8" letter-spacing="3.5">TECHNOLOGIES</text>
</svg>
