<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="grad3dots" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow3dots" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dots Cluster Graphic -->
  <g transform="translate(10, 10)">
    <!-- Connecting Glow Lines -->
    <path d="M 30 70 L 60 30 L 90 70 Z" fill="none" stroke="url(#grad3dots)" stroke-width="4" opacity="0.4" stroke-dasharray="4 4" />
    
    <!-- Three Dots -->
    <circle cx="30" cy="70" r="16" fill="url(#grad3dots)" filter="url(#glow3dots)" />
    <circle cx="60" cy="30" r="18" fill="url(#grad3dots)" filter="url(#glow3dots)" />
    <circle cx="90" cy="70" r="16" fill="url(#grad3dots)" filter="url(#glow3dots)" />
  </g>

  <!-- Typography -->
  <text x="135" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="-1">3dots</text>
  <text x="137" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#a78bfa" letter-spacing="4">STUDIO &amp; DESIGN</text>
</svg>
