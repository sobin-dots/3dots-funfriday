<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" rx="16" fill="#1f1010"/>
  <circle cx="150" cy="150" r="125" fill="#2e1717" stroke="#e74c3c" stroke-width="5"/>
  <!-- Colonel Sanders face outline & bowtie -->
  <circle cx="150" cy="100" r="24" fill="#ffffff"/>
  <!-- Glasses & mustache -->
  <rect x="136" y="94" width="10" height="8" rx="2" fill="#111"/>
  <rect x="154" y="94" width="10" height="8" rx="2" fill="#111"/>
  <path d="M 140 110 Q 150 118 160 110" stroke="#111" stroke-width="3" fill="none"/>
  <!-- String tie -->
  <polygon points="150,124 140,140 160,140" fill="#111"/>
  <text x="150" y="170" font-family="'Times New Roman', serif" font-size="18" font-weight="900" fill="#ffffff" letter-spacing="1" text-anchor="middle">SECRET RECIPE</text>
  <text x="150" y="195" font-family="'Times New Roman', serif" font-size="22" font-weight="900" fill="#e74c3c" letter-spacing="2" text-anchor="middle">11 HERBS &amp; SPICES</text>
  <text x="150" y="240" font-family="sans-serif" font-size="11" fill="#aaaaaa" text-anchor="middle">FIRST FRANCHISE LOGO (1952)</text>
</svg>
