<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" rx="16" fill="#1c1612"/>
  <rect x="50" y="50" width="200" height="200" rx="36" fill="#8b5a2b" stroke="#5c3a19" stroke-width="6"/>
  <!-- Leather texture top band -->
  <rect x="50" y="50" width="200" height="60" rx="0" fill="#603813"/>
  <!-- Rainbow Stripes -->
  <rect x="65" y="50" width="10" height="200" fill="#e74c3c"/>
  <rect x="75" y="50" width="10" height="200" fill="#f1c40f"/>
  <rect x="85" y="50" width="10" height="200" fill="#2ecc71"/>
  <rect x="95" y="50" width="10" height="200" fill="#3498db"/>
  <!-- Camera Lens -->
  <circle cx="170" cy="150" r="45" fill="#111" stroke="#d4af37" stroke-width="5"/>
  <circle cx="170" cy="150" r="30" fill="#222" stroke="#444" stroke-width="3"/>
  <circle cx="170" cy="150" r="14" fill="#0c2340"/>
  <circle cx="178" cy="142" r="5" fill="#ffffff" opacity="0.8"/>
  <!-- Viewfinder -->
  <rect x="195" y="70" width="30" height="22" rx="6" fill="#222" stroke="#d4af37" stroke-width="2"/>
  <rect x="202" y="76" width="16" height="10" rx="2" fill="#00ffff" opacity="0.6"/>
  <text x="150" y="275" font-family="sans-serif" font-size="11" font-weight="bold" fill="#a4a9d4" text-anchor="middle">VINTAGE 2010 CAMERA ICON</text>
</svg>
