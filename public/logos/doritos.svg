<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" rx="16" fill="#20150d"/>
  <rect x="25" y="40" width="250" height="220" rx="16" fill="#332214" stroke="#f39c12" stroke-width="4"/>
  <!-- 1966 Colorful square boxes with ? replacing letter texts -->
  <g font-family="'Impact', sans-serif" font-size="28" font-weight="900" text-anchor="middle">
    <rect x="40" y="100" width="30" height="36" fill="#e74c3c"/><text x="55" y="128" fill="#fff">?</text>
    <rect x="73" y="100" width="30" height="36" fill="#f1c40f"/><text x="88" y="128" fill="#111">?</text>
    <rect x="106" y="100" width="30" height="36" fill="#2ecc71"/><text x="121" y="128" fill="#fff">?</text>
    <rect x="139" y="100" width="30" height="36" fill="#3498db"/><text x="154" y="128" fill="#fff">?</text>
    <rect x="172" y="100" width="30" height="36" fill="#9b59b6"/><text x="187" y="128" fill="#fff">?</text>
    <rect x="205" y="100" width="30" height="36" fill="#e67e22"/><text x="220" y="128" fill="#fff">?</text>
    <rect x="238" y="100" width="24" height="36" fill="#e74c3c"/><text x="250" y="128" fill="#fff">?</text>
  </g>
  <text x="150" y="180" font-family="'Arial', sans-serif" font-size="14" font-weight="bold" fill="#f39c12" letter-spacing="3" text-anchor="middle">TORTILLA CHIPS</text>
  <text x="150" y="235" font-family="sans-serif" font-size="11" fill="#aaaaaa" text-anchor="middle">ORIGINAL 1966 COLORED BOX LOGO</text>
</svg>
