<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" rx="16" fill="#12151d"/>
  <circle cx="150" cy="150" r="125" fill="#1d2230" stroke="#cccccc" stroke-width="4"/>
  <!-- Gear cog teeth outline -->
  <circle cx="150" cy="150" r="110" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="14,8"/>
  <circle cx="150" cy="150" r="85" fill="none" stroke="#ffffff" stroke-width="4"/>
  <!-- Anonymized geometric gear spokes replacing VW letter details -->
  <line x1="150" y1="65" x2="150" y2="235" stroke="#ffffff" stroke-width="8"/>
  <line x1="65" y1="150" x2="235" y2="150" stroke="#ffffff" stroke-width="8"/>
  <line x1="90" y1="90" x2="210" y2="210" stroke="#ffffff" stroke-width="6"/>
  <line x1="90" y1="210" x2="210" y2="90" stroke="#ffffff" stroke-width="6"/>
  <circle cx="150" cy="150" r="40" fill="#1d2230" stroke="#ffffff" stroke-width="4"/>
  <text x="150" y="260" font-family="sans-serif" font-size="11" font-weight="bold" fill="#aaaaaa" text-anchor="middle">ORIGINAL 1939 GEAR EMBLEM</text>
</svg>
